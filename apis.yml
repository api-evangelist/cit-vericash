name: Cit Vericash
description: >-
  CIT Vericash is a fintech enablement platform from CIT Global (founded in Toronto,
  Canada in 1993) that empowers banks, neo banks, microfinance institutions, and
  fintechs to launch and operate digital financial services. Its high-configuration,
  no-code/low-code VERICASH platform delivers digital banking, agency banking, digital
  payments, and mobile wallet capabilities across an omnichannel surface (mobile, USSD,
  web, and agent networks), with AI-powered customer intelligence and fraud prevention.
  The platform is live across roughly 25 markets in Africa and the Middle East, serving
  banked and unbanked communities to advance financial inclusion in emerging markets.
  CIT Vericash is a portfolio company of Anthemis and was added to the API Evangelist
  network from the VC portfolio pipeline.
